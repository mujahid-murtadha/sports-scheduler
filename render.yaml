# إعداد النشر على Render: خدمة ويب + قاعدة PostgreSQL، يُربطان تلقائياً
# الاستخدام: render.com ← New ← Blueprint ← اختر هذا المستودع ← Apply
services:
  - type: web
    name: sports-scheduler
    runtime: node
    plan: free
    region: frankfurt          # الأقرب للسودان والخليج
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sports-scheduler-db
          property: connectionString

databases:
  - name: sports-scheduler-db
    plan: free
    region: frankfurt
